<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Martonsky</title>
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&amp;display=swap" rel="stylesheet">

<style>
/* Martonsky-inspired UI skin. Viewer/rendering logic below is unchanged. */
:root{
    --page:#fff;
    --ink:#111;
    --muted:#999;
    --rule:#111;
    --menu-bg:#fff;
    --ui-font:"Playfair Display",Georgia,serif;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    background:var(--page);
    color:var(--ink);
}

body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    font-family:var(--ui-font);
    font-size:13px;
    font-weight:400;
    line-height:1.25;
    letter-spacing:0;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
}

header{
    width:100%;
    min-height:72px;
    display:flex;
    align-items:center;
    padding:18px 27px 16px;
    background:var(--page);
    position:relative;
    z-index:1000;
    flex-shrink:0;
}

.logo{
    display:block;
    margin-right:44px;
    text-decoration:none;
    cursor:pointer;
    flex-shrink:0;
}

.logo img{
    display:block;
    width:155px;
    height:auto;
    border:0;
}

nav{
    flex:1;
    display:flex;
    justify-content:flex-end;
}

nav>ul{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:28px;
    list-style:none;
}

nav li{
    list-style:none;
}

nav a,
.menu-label,
.submenu-label,
.empty-item{
    font-family:var(--ui-font);
    color:var(--ink);
    text-decoration:none;
    font-size:13px;
    font-weight:400;
    line-height:1.25;
}

nav a,
.menu-label,
.submenu-label{
    cursor:pointer;
}

nav a:hover,
.menu-label:hover,
.submenu-label:hover{
    opacity:.48;
}

.top-menu-item{
    position:relative;
}

.top-menu-item>.menu-label{
    display:inline-flex;
    align-items:center;
    gap:9px;
}

.top-menu-item>.menu-label::after{
    content:"";
    display:block;
    width:8px;
    height:8px;
    margin-top:-4px;
    border-right:1px solid currentColor;
    border-bottom:1px solid currentColor;
    transform:rotate(45deg);
    transform-origin:center;
}

/* Desktop drop-downs: sharp white boxes with the thin black rule used
   throughout the original Martonsky visual language. */
.submenu{
    display:none;
    position:absolute;
    top:calc(100% + 9px);
    left:-10px;
    min-width:208px;
    background:var(--menu-bg);
    border:1px solid var(--rule);
    padding:5px 0;
    z-index:2000;
    box-shadow:none;
}

/* small bridge: keeps hover active between label and menu */
.submenu::before{
    content:"";
    position:absolute;
    left:-1px;
    right:-1px;
    top:-10px;
    height:10px;
}

.top-menu-item:hover>.submenu{
    display:block;
}

.submenu li{
    position:relative;
    display:block;
}

.submenu a,
.submenu-label,
.empty-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    min-width:206px;
    padding:5px 10px 5px 10px;
    white-space:nowrap;
    background:var(--menu-bg);
}

.submenu a:hover,
.submenu-label:hover{
    opacity:1;
    background:#f2f2f2;
}

.submenu li>.submenu{
    display:none;
    position:absolute;
    top:-6px;
    left:calc(100% + 5px);
    padding:5px 0;
}

.submenu li>.submenu::before{
    left:-6px;
    top:-1px;
    bottom:-1px;
    width:6px;
    height:auto;
    right:auto;
}

.submenu li.has-submenu:hover>.submenu{
    display:block;
}

.arrow{
    margin-left:28px;
    font-size:16px;
    font-weight:300;
    line-height:12px;
}

.empty-item,
.empty-section{
    color:var(--muted);
    opacity:1;
    cursor:default;
}

main{
    width:100%;
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    background:var(--page);
    perspective:1400px;
}

.project-curtain-enter{
    transform-origin:50% 0;
    backface-visibility:hidden;
    animation:projectCurtainDown .82s cubic-bezier(.18,.78,.2,1) both;
}

@keyframes projectCurtainDown{
    0%{
        opacity:0;
        clip-path:inset(0 0 100% 0);
        transform:translateY(-34px) rotateX(-16deg) scaleY(.94);
        filter:brightness(.82);
    }
    58%{
        opacity:1;
        transform:translateY(3px) rotateX(2.2deg) scaleY(1.01);
        filter:brightness(1.03);
    }
    100%{
        opacity:1;
        clip-path:inset(0 0 0 0);
        transform:translateY(0) rotateX(0) scaleY(1);
        filter:brightness(1);
    }
}

@media(prefers-reduced-motion:reduce){
    .project-curtain-enter{
        animation:none;
    }
}

#viewer{
    width:100%;
    min-height:calc(100vh - 110px);
    background:var(--page);
    overflow-x:auto;
    overflow-y:hidden;
}

.pdf-page{
    display:block;
    max-width:none;
    margin:0 auto;
    padding:0;
    border:0;
    outline:0;
    background:var(--page);
}

#htmlViewer{
    width:100%;
    background:var(--page);
    display:none;
}

#contactViewer{
    display:none;
    width:100%;
    align-self:stretch;
    padding:54px 24px 80px;
    background:var(--page);
}

.contact-page{
    width:min(760px,100%);
    margin:0 auto;
}

.contact-page h1{
    margin:0 0 50px;
    font-family:var(--ui-font);
    font-size:42px;
    font-weight:300;
    line-height:1.15;
    text-align:center;
}

.contact-form{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:22px 28px;
}

.contact-field-full,
.contact-submit{
    grid-column:1/-1;
}

.contact-form input,
.contact-form textarea{
    display:block;
    width:100%;
    border:0;
    border-bottom:1px solid #d6d6d6;
    border-radius:0;
    padding:11px 0;
    background:transparent;
    color:var(--ink);
    font:400 14px/1.4 var(--ui-font);
    outline:0;
}

.contact-form textarea{
    min-height:125px;
    resize:vertical;
}

.contact-form input:focus,
.contact-form textarea:focus{
    border-bottom-color:var(--ink);
}

.contact-form input::placeholder,
.contact-form textarea::placeholder{
    color:#777;
    opacity:1;
}

.contact-submit{
    padding-top:13px;
    text-align:center;
}

.contact-submit button{
    min-width:116px;
    border:1px solid var(--ink);
    border-radius:0;
    padding:11px 21px;
    background:var(--ink);
    color:#fff;
    font:400 13px/1 var(--ui-font);
    cursor:pointer;
}

.contact-submit button:hover{
    background:#fff;
    color:var(--ink);
}

#svgViewer{
    width:100%;
    background:var(--page);
    display:none;
    overflow-x:auto;
}

#svgViewer svg{
    display:block;
    max-width:none;
    margin-left:auto;
    margin-right:auto;
    padding:0;
    border:0;
    outline:0;
    background:var(--page);
}

#loading{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    align-items:center;
    justify-content:center;
    pointer-events:none;
}

#loading.loading-visible{
    display:flex;
}

.loading-spinner{
    width:30px;
    height:30px;
    border:2px solid #d9d9d9;
    border-top-color:#000;
    border-radius:50%;
    animation:loading-spin .7s linear infinite;
}

@keyframes loading-spin{
    to{
        transform:rotate(360deg);
    }
}

footer{
    width:100%;
    margin-top:auto;
    padding:16px 27px 18px;
    background:var(--page);
    font-family:var(--ui-font);
    font-size:10px;
    font-weight:400;
    line-height:1.2;
    text-align:center;
    flex-shrink:0;
}

footer a{
    color:inherit;
    text-decoration:none;
}

footer a:hover{
    text-decoration:underline;
}

.mobile-button{
    display:none;
    background:none;
    border:0;
    padding:0;
    color:var(--ink);
    font-family:var(--ui-font);
    font-size:20px;
    font-weight:300;
    line-height:1;
    cursor:pointer;
}

.search-button{
    display:flex;
    align-items:center;
    justify-content:center;
    width:42px;
    height:42px;
    margin-left:30px;
    padding:0;
    border:0;
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    flex-shrink:0;
}

.search-button svg{
    display:block;
    width:29px;
    height:29px;
    stroke:currentColor;
}

.search-button:hover{
    opacity:.48;
}

.search-panel{
    display:none;
    position:fixed;
    inset:0;
    z-index:10000;
    padding:26px;
    background:rgba(255,255,255,.98);
}

.search-panel.open{
    display:block;
}

.search-close{
    position:absolute;
    top:24px;
    right:28px;
    border:0;
    padding:4px;
    background:transparent;
    color:var(--ink);
    font:300 34px/1 var(--ui-font);
    cursor:pointer;
}

.search-box{
    width:min(760px,calc(100% - 40px));
    margin:13vh auto 0;
}

.search-box input{
    display:block;
    width:100%;
    border:0;
    border-bottom:1px solid var(--ink);
    border-radius:0;
    padding:12px 2px;
    background:transparent;
    color:var(--ink);
    font:300 32px/1.25 var(--ui-font);
    outline:0;
}

.search-box input::placeholder{
    color:#999;
    opacity:1;
}

.search-results{
    width:100%;
    margin-top:22px;
    list-style:none;
}

.search-results li{
    border-bottom:1px solid #e4e4e4;
}

.search-results button{
    width:100%;
    border:0;
    padding:12px 2px;
    background:transparent;
    color:var(--ink);
    font:400 14px/1.3 var(--ui-font);
    text-align:left;
    cursor:pointer;
}

.search-results button:hover{
    opacity:.48;
}

.search-empty{
    padding:14px 2px;
    color:var(--muted);
}

.video-project{
    width:100%;
    max-width:1200px;
    margin:0 auto;
    padding:20px 20px 60px;
}

.video-item{
    width:100%;
    margin-bottom:50px;
}

.video-item iframe{
    display:block;
    width:100%;
    aspect-ratio:16/9;
    border:0;
}

.video-item p{
    margin-top:8px;
    text-align:center;
    font-size:12px;
    line-height:1.4;
}

.video-item h2{
    font-size:16px;
    font-weight:400;
    margin-bottom:8px;
}

@media(max-width:800px){
    header{
        min-height:58px;
        align-items:flex-start;
        justify-content:space-between;
        padding:16px 18px 12px;
    }

    .logo{
        margin-right:0;
    }

    .logo img{
        width:120px;
    }

    .mobile-button{
        display:block;
        margin-top:1px;
    }

    nav{
        display:none;
        position:absolute;
        left:0;
        top:54px;
        width:100%;
        background:var(--page);
        padding:14px 18px 18px;
        border-top:1px solid var(--rule);
        border-bottom:1px solid var(--rule);
    }

    nav.open{
        display:block;
    }

    nav>ul{
        display:block;
    }

    nav>ul>li{
        margin:0;
        border-bottom:1px solid #dedede;
    }

    nav>ul>li:last-child{
        border-bottom:0;
    }

    nav a,
    .menu-label,
    .submenu-label,
    .empty-item{
        font-size:13px;
    }

    .submenu{
        display:none;
        position:static;
        min-width:0;
        margin:0;
        padding:3px 0 10px 15px;
        border:0;
        background:transparent;
    }

    .top-menu-item.mobile-expanded>.submenu,
    .has-submenu.mobile-expanded>.submenu{
        display:block;
    }

    .submenu::before{
        display:none;
    }

    .submenu li>.submenu{
        display:none;
        position:static;
        margin:0;
        padding:2px 0 5px 14px;
        border:0;
    }

    .submenu a,
    .submenu-label,
    .empty-item{
        min-width:0;
        padding:6px 12px 6px 0;
        background:transparent;
    }

    nav>ul>li>a,
    nav>ul>li>.menu-label,
    nav>ul>li>.empty-section{
        display:flex;
        align-items:center;
        justify-content:space-between;
        width:100%;
        padding:11px 2px;
    }

    .submenu a:hover,
    .submenu-label:hover{
        background:transparent;
        opacity:.48;
    }

    .arrow{
        display:block;
        margin-left:20px;
        transition:transform .2s ease;
    }

    .has-submenu.mobile-expanded>.submenu-label .arrow{
        transform:rotate(90deg);
    }

    .top-menu-item>.menu-label::after{
        display:block;
        margin-right:3px;
        transition:transform .2s ease;
    }

    .top-menu-item.mobile-expanded>.menu-label::after{
        transform:rotate(225deg);
        margin-top:4px;
    }

    main{
        flex:1;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    #svgViewer{
        display:none;
        width:100%;
        overflow-x:auto;
    }

    #svgViewer svg{
        margin-left:auto;
        margin-right:auto;
    }

    .video-project{
        padding:10px 12px 40px;
    }

    .search-button{
        width:32px;
        height:32px;
        margin-left:auto;
        margin-right:18px;
    }

    .search-button svg{
        width:24px;
        height:24px;
    }

    .search-panel{
        padding:18px;
    }

    .search-close{
        top:16px;
        right:18px;
    }

    .search-box{
        width:100%;
        margin-top:12vh;
    }

    .search-box input{
        font-size:25px;
    }

    #contactViewer{
        padding:38px 20px 60px;
    }

    .contact-page h1{
        margin-bottom:34px;
        font-size:32px;
    }

    .contact-form{
        grid-template-columns:1fr;
        gap:18px;
    }

    .contact-field-full,
    .contact-submit{
        grid-column:1;
    }

    footer{
        padding:14px 18px 16px;
        font-size:10px;
        white-space:normal;
    }
}
</style>
</head>

<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

const viewer = document.getElementById("viewer");
const htmlViewer = document.getElementById("htmlViewer");
const svgViewer = document.getElementById("svgViewer");
const contactViewer = document.getElementById("contactViewer");
const loading = document.getElementById("loading");
const searchPanel = document.getElementById("searchPanel");
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");

let currentRenderId = 0;
let searchIndexPromise = null;
let searchRequestId = 0;

function revealProject(element){

    element.classList.remove("project-curtain-enter");
    void element.offsetWidth;
    element.classList.add("project-curtain-enter");

}

function hideAllViewers(){

    viewer.style.display = "none";
    htmlViewer.style.display = "none";
    svgViewer.style.display = "none";
    contactViewer.style.display = "none";

    viewer.innerHTML = "";
    htmlViewer.innerHTML = "";
    svgViewer.innerHTML = "";

    [viewer,htmlViewer,svgViewer,contactViewer]
        .forEach(element => element.classList.remove("project-curtain-enter"));

}

window.loadPDF = async function(url){

    const renderId = ++currentRenderId;

    closeMobileMenu();
    hideAllViewers();

    viewer.style.display = "block";
    loading.classList.add("loading-visible");

    try{

        const pdf = await pdfjsLib
            .getDocument(url)
            .promise;

        if(renderId !== currentRenderId){
            return;
        }

        const initialViewerWidth = viewer.clientWidth;

        for(
            let pageNumber = 1;
            pageNumber <= pdf.numPages;
            pageNumber++
        ){

            if(renderId !== currentRenderId){
                return;
            }

            const page = await pdf.getPage(pageNumber);

            const baseViewport = page.getViewport({
                scale:1
            });

            const scale =
                initialViewerWidth /
                baseViewport.width;

            const viewport = page.getViewport({
                scale:scale
            });

            const canvas =
                document.createElement("canvas");

            canvas.className = "pdf-page";

            const context =
                canvas.getContext("2d");

            const pixelRatio =
                window.devicePixelRatio || 1;

            canvas.width =
                Math.floor(
                    viewport.width *
                    pixelRatio
                );

            canvas.height =
                Math.floor(
                    viewport.height *
                    pixelRatio
                );

            canvas.style.width =
                viewport.width + "px";

            canvas.style.height =
                viewport.height + "px";

            viewer.appendChild(canvas);

            await page.render({
                canvasContext:context,
                viewport:viewport,
                transform:
                    pixelRatio !== 1
                    ? [
                        pixelRatio,
                        0,
                        0,
                        pixelRatio,
                        0,
                        0
                    ]
                    : null
            }).promise;
        }

        loading.classList.remove("loading-visible");
        revealProject(viewer);

    }
    catch(error){

        if(renderId !== currentRenderId){
            return;
        }

        loading.classList.remove("loading-visible");

        viewer.innerHTML =
        "<p style='padding:40px;text-align:center'>Unable to load PDF.</p>";

        console.error(error);
    }
};

window.loadSVG = async function(url){

    const renderId = ++currentRenderId;

    closeMobileMenu();
    hideAllViewers();

    svgViewer.style.display = "block";
    loading.classList.add("loading-visible");

    try{

        const response =
            await fetch(url);

        if(!response.ok){
            throw new Error(
                "HTTP error: " +
                response.status
            );
        }

        const svgText =
            await response.text();

        if(renderId !== currentRenderId){
            return;
        }

        svgViewer.innerHTML =
            svgText;

        const svg =
            svgViewer.querySelector("svg");

        if(!svg){
            throw new Error(
                "Il file caricato non contiene un elemento <svg> valido."
            );
        }

        if(!svg.hasAttribute("viewBox")){

            const width =
                parseFloat(
                    svg.getAttribute("width")
                );

            const height =
                parseFloat(
                    svg.getAttribute("height")
                );

            if(
                Number.isFinite(width) &&
                Number.isFinite(height)
            ){
                svg.setAttribute(
                    "viewBox",
                    `0 0 ${width} ${height}`
                );
            }
        }

        svg.removeAttribute("width");
        svg.removeAttribute("height");

        svg.setAttribute(
            "preserveAspectRatio",
            "xMidYMin meet"
        );

        const initialViewerWidth =
            svgViewer.clientWidth;

        svg.style.display = "block";
        svg.style.width =
            initialViewerWidth + "px";
        svg.style.height = "auto";
        svg.style.maxWidth = "none";
        svg.style.marginLeft = "auto";
        svg.style.marginRight = "auto";

        svgViewer.scrollLeft = 0;

        loading.classList.remove("loading-visible");
        revealProject(svgViewer);

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
    catch(error){

        if(renderId !== currentRenderId){
            return;
        }

        loading.classList.remove("loading-visible");

        svgViewer.innerHTML =
        "<p style='padding:40px;text-align:center'>Unable to load SVG.</p>";

        console.error(error);
    }
};

window.loadHTML = async function(url){

    const renderId = ++currentRenderId;

    closeMobileMenu();
    hideAllViewers();

    htmlViewer.style.display = "block";
    loading.classList.add("loading-visible");

    try{

        const response =
            await fetch(url);

        if(!response.ok){
            throw new Error(
                "HTTP error: " +
                response.status
            );
        }

        const pageHtml =
            await response.text();

        if(renderId !== currentRenderId){
            return;
        }

        htmlViewer.innerHTML = pageHtml;

        htmlViewer
        .querySelectorAll("script")
        .forEach(oldScript => {

            const newScript =
                document.createElement("script");

            [...oldScript.attributes]
                .forEach(attribute => {

                    newScript.setAttribute(
                        attribute.name,
                        attribute.value
                    );

                });

            newScript.textContent =
                oldScript.textContent;

            oldScript.replaceWith(
                newScript
            );
        });

        loading.classList.remove("loading-visible");
        revealProject(htmlViewer);

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
    catch(error){

        if(renderId !== currentRenderId){
            return;
        }

        loading.classList.remove("loading-visible");

        htmlViewer.innerHTML =
        "<p style='padding:40px;text-align:center'>Unable to load HTML page.</p>";

        console.error(error);
    }
};

window.loadContact = function(){

    ++currentRenderId;

    closeMobileMenu();
    hideAllViewers();
    loading.classList.remove("loading-visible");

    contactViewer.style.display = "block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

};

window.loadHome = function(){

    loadSVG(
        "pdf/home.svg"
    );

};

window.toggleMenu = function(){

    const menu = document.getElementById("mainMenu");
    menu.classList.toggle("open");

    if(!menu.classList.contains("open")){
        closeMobileAccordions();
    }

};

function closeMobileAccordions(){

    document
        .querySelectorAll("#mainMenu .mobile-expanded")
        .forEach(item => item.classList.remove("mobile-expanded"));

}

function setupMobileAccordion(){

    document
        .querySelectorAll("#mainMenu .menu-label, #mainMenu .submenu-label")
        .forEach(label => {
            label.setAttribute("role","button");
            label.setAttribute("tabindex","0");

            const toggle = function(event){
                if(!window.matchMedia("(max-width:800px)").matches){
                    return;
                }

                event.preventDefault();
                event.stopPropagation();

                const item = label.parentElement;
                const willOpen = !item.classList.contains("mobile-expanded");

                [...item.parentElement.children].forEach(sibling => {
                    if(sibling !== item){
                        sibling.classList.remove("mobile-expanded");
                    }
                });

                item.classList.toggle("mobile-expanded",willOpen);
            };

            label.addEventListener("click",toggle);
            label.addEventListener("keydown",event => {
                if(event.key === "Enter" || event.key === " "){
                    toggle(event);
                }
            });
        });

}

function searchableLinks(){

    return [...document.querySelectorAll("#mainMenu a")]
        .map(link => ({
            label:link.textContent.trim(),
            link:link,
            svgUrl:extractSvgUrl(link)
        }))
        .filter(item => item.label);

}

function extractSvgUrl(link){

    const handler = link.getAttribute("onclick") || "";
    const match = handler.match(/loadSVG\(\s*(["'])(.*?)\1\s*\)/);
    return match ? match[2] : null;

}

function normalizeSearchText(value){

    return value
        .replace(/\s+/g," ")
        .trim()
        .toLocaleLowerCase();

}

function buildSearchIndex(){

    if(searchIndexPromise){
        return searchIndexPromise;
    }

    const items = searchableLinks();

    searchIndexPromise = Promise.all(items.map(async item => {
        let svgContent = "";

        if(item.svgUrl){
            try{
                const response = await fetch(item.svgUrl);
                if(response.ok){
                    const source = await response.text();
                    const documentSvg = new DOMParser()
                        .parseFromString(source,"image/svg+xml");

                    svgContent = [
                        ...documentSvg.querySelectorAll("text, title, desc, metadata")
                    ]
                    .map(node => node.textContent || "")
                    .join(" ");
                }
            }
            catch(error){
                console.warn("Unable to index SVG:",item.svgUrl,error);
            }
        }

        return {
            ...item,
            searchableText:normalizeSearchText(item.label + " " + svgContent)
        };
    }));

    return searchIndexPromise;

}

async function renderSearchResults(query){

    const requestId = ++searchRequestId;
    const normalized = normalizeSearchText(query);
    searchResults.innerHTML = "";

    if(!normalized){
        return;
    }

    const loadingRow = document.createElement("li");
    loadingRow.className = "search-empty";
    loadingRow.textContent = "Searching…";
    searchResults.appendChild(loadingRow);

    const index = await buildSearchIndex();

    if(requestId !== searchRequestId){
        return;
    }

    searchResults.innerHTML = "";

    const matches = index
        .filter(item => item.searchableText.includes(normalized));

    if(matches.length === 0){
        const empty = document.createElement("li");
        empty.className = "search-empty";
        empty.textContent = "No results";
        searchResults.appendChild(empty);
        return;
    }

    matches.forEach(item => {
        const row = document.createElement("li");
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = item.label;
        button.addEventListener("click", function(){
            closeSearch();
            item.link.click();
        });
        row.appendChild(button);
        searchResults.appendChild(row);
    });

}

window.openSearch = function(){

    closeMobileMenu();
    searchPanel.classList.add("open");
    document.body.style.overflow = "hidden";
    searchInput.value = "";
    searchResults.innerHTML = "";
    buildSearchIndex();
    window.setTimeout(() => searchInput.focus(),0);

};

window.closeSearch = function(){

    searchPanel.classList.remove("open");
    document.body.style.overflow = "";

};

searchInput.addEventListener("input", function(){
    renderSearchResults(searchInput.value);
});

searchPanel.addEventListener("click", function(event){
    if(event.target === searchPanel){
        closeSearch();
    }
});

document.addEventListener("keydown", function(event){
    if(event.key === "Escape" && searchPanel.classList.contains("open")){
        closeSearch();
    }
});

window.closeMobileMenu = function(){

    document
        .getElementById("mainMenu")
        .classList
        .remove("open");

    closeMobileAccordions();

};

document.addEventListener(
"DOMContentLoaded",
function(){

    setupMobileAccordion();
    loadHome();

});

</script>
